name: CI

on: push

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: npm audit action
        uses: oke-py/npm-audit-action@v3.0.0

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - run: npm ci

    - run: npm run test:coverage

    # GitHub Pages serves a project site from /<repository-name>/, so the
    # bundle is built with that base path. The same bundle is deployed below:
    # build once, deploy what was tested.
    - run: npm run build -- --base=/${{ github.event.repository.name }}/

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload the site for deployment
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v4
      with:
        path: dist

  # Continuous deployment: every commit on main that passes the security scan,
  # the tests and the build is published to GitHub Pages.
  # Requires Settings > Pages > Source set to "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [security-scan, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never run two deployments at once, and never cancel one halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test the live site
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            "${{ steps.deployment.outputs.page_url }}" | grep -q '<div id="root">'
